<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <title>Offline - IPTV</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #09090b;
      color: #e4e4e7;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
      padding: 16px;
      box-sizing: border-box;
    }
    main { max-width: 22rem; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    h1 { margin: 8px 0 0; font-size: 1.25rem; color: #fff; }
    p { margin: 0; color: #a1a1aa; line-height: 1.5; }
    button {
      margin-top: 8px;
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      background: #facc15;
      color: #09090b;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <!-- Inline so it shows without a network connection. -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="72" height="72" aria-hidden="true">
      <rect width="512" height="512" rx="112" fill="#09090b"/>
      <g fill="none" stroke="#facc15" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
        <path d="M200 112 256 164 312 112"/>
        <rect x="104" y="164" width="304" height="224" rx="44"/>
      </g>
      <path d="M232 226 308 276 232 326Z" fill="#facc15" stroke="#facc15" stroke-width="14" stroke-linejoin="round"/>
    </svg>
    <h1>You're offline</h1>
    <p>IPTV needs a connection to reach your TV service. Check your internet connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
